{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список изделий</title>
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <script src="{% static 'js/htmx.min.js' %}"></script>
</head>
<body>

<div class="container">
    <div class="navbar">
        <a href="{% url 'employee_dashboard' %}" class="nav-link active">Изделия</a>
        <a href="{% url 'employee_items' %}" class="nav-link">В работе</a>
        <a href="{% url 'top_workers' %}" class="nav-link">Топ</a>
    </div>
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{% if message.tags == 'error' %}error{% else %}success{% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}
    <div class="search-container" style="margin-bottom: 16px;">
        <input type="text" 
               name="q" 
               id="productSearchInput" 
               class="search-input" 
               placeholder="Поиск по номеру или названию"
               value="{{ search_query }}"
               hx-get="{% url 'employee_dashboard' %}"
               hx-trigger="keyup changed delay:300ms"
               hx-target="#employee-dashboard-container"
               hx-swap="innerHTML">
    </div>

    <div id="employee-dashboard-container"
         hx-get="{% url 'employee_dashboard' %}"
         hx-trigger="every 5s"
         hx-include="#productSearchInput"
         hx-swap="innerHTML">
        {% include 'includes/employee_dashboard_partial.html' %}
    </div>
</div>

</body>
</html>
