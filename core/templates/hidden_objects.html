{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Скрытые объекты</title>
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <script src="{% static 'js/htmx.min.js' %}"></script>
</head>
<body>

<div class="container">
    <nav class="navbar">
        <button type="button" class="burger-btn" id="burgerBtn" aria-label="Открыть меню">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <div class="nav-links" id="navLinks">
            <a href="{% url 'master_dashboard' %}" class="nav-link">Объекты</a>
            <a href="{% url 'items_in_work' %}" class="nav-link">Изделия в работе</a>
            <a href="{% url 'workers_stats' %}" class="nav-link">Работники</a>
            <a href="{% url 'hidden_objects' %}" class="nav-link active">Скрытые объекты</a>
            <a href="{% url 'top_workers' %}" class="nav-link">Топ работников</a>
        </div>
    </nav>

    <header>
        <h1>Скрытые объекты</h1>
    </header>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <div class="search-bar" style="margin-bottom: 20px;">
        <input type="text" 
               name="q" 
               id="objectSearchInput" 
               class="form-control" 
               placeholder="Поиск объектов по номеру, названию или названию заказчика"
               value="{{ search_query|default:'' }}"
               hx-get="{% url 'hidden_objects' %}"
               hx-trigger="keyup changed delay:300ms"
               hx-target="#hidden-objects-table-container"
               hx-swap="innerHTML">
    </div>

    <div id="hidden-objects-table-container"
         hx-get="{% url 'hidden_objects' %}"
         hx-trigger="every 5s"
         hx-include="#objectSearchInput"
         hx-swap="innerHTML">
        {% include 'includes/hidden_objects_table_partial.html' %}
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const burgerBtn = document.getElementById('burgerBtn');
        const navLinks = document.getElementById('navLinks');

        if (burgerBtn && navLinks) {
            burgerBtn.addEventListener('click', function() {
                burgerBtn.classList.toggle('is-active');
                navLinks.classList.toggle('is-open');
            });

            document.addEventListener('click', function(event) {
                if (!burgerBtn.contains(event.target) && !navLinks.contains(event.target)) {
                    burgerBtn.classList.remove('is-active');
                    navLinks.classList.remove('is-open');
                }
            });
        }
    });
</script>
</body>
</html>
