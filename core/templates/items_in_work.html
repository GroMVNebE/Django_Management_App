{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Изделия в работе</title>
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <script src="{% static 'js/htmx.min.js' %}"></script>
</head>
<body>

<div class="container">
    <nav class="navbar">
        <button type="button" class="burger-btn" id="burgerBtn" aria-label="Открыть меню">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <div class="nav-links" id="navLinks">
            <a href="{% url 'master_dashboard' %}" class="nav-link">Объекты</a>
            <a href="{% url 'items_in_work' %}" class="nav-link active">Изделия в работе</a>
            <a href="{% url 'workers_stats' %}" class="nav-link">Работники</a>
            <a href="{% url 'hidden_objects' %}" class="nav-link">Скрытые объекты</a>
            <a href="{% url 'import_objects' %}" class="nav-link">Импорт объектов</a>
            <a href="{% url 'top_workers' %}" class="nav-link">Топ работников</a>
        </div>
    </nav>

    <div class="header">
        <h1>Изделия в работе и очереди</h1>
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{% if message.tags == 'error' %}error{% else %}success{% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <div id="items-list-container"
         hx-get="{% url 'items_in_work' %}"
         hx-trigger="every 5s"
         hx-swap="innerHTML">
        {% include "includes/items_in_work_partial.html" %}
    </div>

</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const burgerBtn = document.getElementById('burgerBtn');
        const navLinks = document.getElementById('navLinks');

        if (burgerBtn && navLinks) {
            burgerBtn.addEventListener('click', function() {
                burgerBtn.classList.toggle('is-active');
                navLinks.classList.toggle('is-open');
            });

            document.addEventListener('click', function(event) {
                if (!burgerBtn.contains(event.target) && !navLinks.contains(event.target)) {
                    burgerBtn.classList.remove('is-active');
                    navLinks.classList.remove('is-open');
                }
            });
        }
    });
</script>
</body>
</html>
