{% if objects %}
<table class="objects-table">
    <thead>
        <tr>
            <th>Номер</th>
            <th style="text-align: right;">Действия</th>
        </tr>
    </thead>
    <tbody>
        {% for obj in objects %}
        <tr class="object-row">
            <td>
                <a href="{% url 'object_detail' obj.hashid %}" class="object-link">
                    {{ obj.number }}
                </a>
            </td>
            <td style="text-align: right;">
                <form method="post" action="{% url 'toggle_object_hidden' obj.id %}" style="display: inline;">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-secondary">
                        Восстановить
                    </button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% else %}
<div class="empty-state">
    Скрытых объектов не найдено
</div>
{% endif %}
