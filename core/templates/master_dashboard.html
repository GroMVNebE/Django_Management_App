{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Объекты</title>
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <script src="{% static 'js/htmx.min.js' %}"></script>
    <style>
        @media (max-width: 640px) {
            td:last-child {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <nav class="navbar">
        <button type="button" class="burger-btn" id="burgerBtn" aria-label="Открыть меню">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <div class="nav-links" id="navLinks">
            <a href="{% url 'master_dashboard' %}" class="nav-link active">Объекты</a>
            <a href="{% url 'items_in_work' %}" class="nav-link">Изделия в работе</a>
            <a href="{% url 'workers_stats' %}" class="nav-link">Работники</a>
            <a href="{% url 'hidden_objects' %}" class="nav-link">Скрытые объекты</a>
            <a href="{% url 'import_objects' %}" class="nav-link">Импорт объектов</a>
        </div>
    </nav>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{% if message.tags == 'error' %}error{% elif message.tags == 'info' %}info{% else %}success{% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <header>
        <h1>Объекты в работе</h1>
        <button type="button" class="btn btn-primary" onclick="openCreateModal()">
            + Добавить пустой объект
        </button>
    </header>
    <div class="search-container">
        <input type="text" 
                name="q" 
                id="objectSearchInput" 
                class="search-input" 
                placeholder="Поиск объектов по номеру, названию или названию заказчика"
                hx-get="{% url 'master_dashboard' %}"
                hx-trigger="keyup changed delay:300ms"
                hx-target="#objects-table-container"
                hx-swap="innerHTML">
    </div>

    <div id="objects-table-container"
        hx-get="{% url 'master_dashboard' %}"
        hx-trigger="every 5s"
        hx-include="#objectSearchInput"
        hx-swap="innerHTML">
        {% include 'includes/objects_table_partial.html' %}
    </div>

    <div class="modal" id="createObjectModal">
        <div class="modal-content">
            <h2>Добавить объект</h2>
            <form method="post" action="{% url 'create_empty_object' %}">
                {% csrf_token %}
                <div style="margin-bottom: 12px;">
                    <label for="id_number" style="display:block; margin-bottom: 4px;">Номер объекта *</label>
                    <input type="text" id="id_number" name="number" required placeholder="Например: 1234-56" class="search-input" style="width: 100%;">
                </div>
                <div style="margin-bottom: 16px;">
                    <label for="id_title" style="display:block; margin-bottom: 4px;">Название (опционально)</label>
                    <input type="text" id="id_title" name="title" placeholder="Название объекта" class="search-input" style="width: 100%;">
                </div>
                <div style="text-align: right; gap: 8px; display: flex; justify-content: flex-end;">
                    <button type="button" class="btn btn-secondary" onclick="closeCreateModal()">Отмена</button>
                    <button type="submit" class="btn btn-primary">Создать</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function openCreateModal() {
        document.getElementById('createObjectModal').classList.add('is-open');
    }
    function closeCreateModal() {
        document.getElementById('createObjectModal').classList.remove('is-open');
    }
    document.addEventListener('DOMContentLoaded', function() {
        const burgerBtn = document.getElementById('burgerBtn');
        const navLinks = document.getElementById('navLinks');

        if (burgerBtn && navLinks) {
            burgerBtn.addEventListener('click', function() {
                burgerBtn.classList.toggle('is-active');
                navLinks.classList.toggle('is-open');
            });

            document.addEventListener('click', function(event) {
                if (!burgerBtn.contains(event.target) && !navLinks.contains(event.target)) {
                    burgerBtn.classList.remove('is-active');
                    navLinks.classList.remove('is-open');
                }
            });
        }
    });
</script>
</body>
</html>
